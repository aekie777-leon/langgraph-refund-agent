name: langgraph-refund-agent

# Local development only. Production must use an external TLS PostgreSQL,
# production OIDC/SCIM settings, and a separately managed gateway.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-refund_agent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  case-migrations:
    image: langgraph-refund-agent:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    entrypoint: ["python", "/deps/project/scripts/apply_migrations.py"]
    environment:
      POSTGRES_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-refund_agent}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  langgraph-api:
    image: langgraph-refund-agent:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-refund_agent}?sslmode=disable
      POSTGRES_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-refund_agent}?sslmode=disable
      REDIS_URI: redis://redis:6379/0
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:?Set LANGSMITH_API_KEY in .env}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      case-migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  outbox-worker:
    image: langgraph-refund-agent:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["python", "-m", "agent.integrations.worker_main"]
    environment:
      POSTGRES_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-refund_agent}?sslmode=disable
      PROVIDER_CONNECTIONS_JSON: ${PROVIDER_CONNECTIONS_JSON:?Set PROVIDER_CONNECTIONS_JSON in .env}
      PROVIDER_ALLOW_INSECURE_HTTP: ${PROVIDER_ALLOW_INSECURE_HTTP:-false}
      OUTBOX_WORKER_ID: ${OUTBOX_WORKER_ID:-}
    depends_on:
      case-migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  inbox-worker:
    image: langgraph-refund-agent:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["python", "-m", "agent.integrations.inbox_worker_main"]
    environment:
      POSTGRES_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-refund_agent}?sslmode=disable
      INBOX_WORKER_ID: ${INBOX_WORKER_ID:-}
    depends_on:
      case-migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
