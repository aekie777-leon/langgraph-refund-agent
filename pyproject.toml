[project]
name = "langgraph-refund-agent"
version = "0.1.1"
description = "A human-in-the-loop refund assistant built with LangGraph."
authors = [{ name = "duxingru" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "langchain-openai>=1.4.2",
    "langgraph>=1.0.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.0.1",
]


[project.optional-dependencies]
dev = [
    "anyio>=4.7.0",
    "mypy>=1.13.0",
    "pytest>=9.0.3",
    "ruff>=0.8.2",
]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent*"]


[tool.setuptools.package-data]
"agent" = ["data/*.json"]

[tool.ruff]
extend-exclude = [".uv-cache", ".venv", "build", "dist"]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
